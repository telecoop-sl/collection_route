<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Collection Route</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== TOP HEADER WITH BUTTONS ===== -->
  <header class="app-header">
    <div class="header-left">
      <h1 class="app-title">Collection Route</h1>
      <span class="last-updated" id="lastUpdated">Last updated: —</span>
    </div>
    <div class="header-right">
      <button id="btnAddRow" class="btn btn-primary" title="Add Row">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span class="btn-text">Add Row</span>
      </button>
      <button id="btnSync" class="btn btn-secondary" title="Sync with Sheets">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        <span class="btn-text">Sync</span>
      </button>
      <button id="btnClearAll" class="btn btn-danger" title="Clear All Routes">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        <span class="btn-text">Clear All</span>
      </button>
      <button id="darkModeToggle" class="icon-btn" title="Toggle Dark Mode" aria-label="Toggle Dark Mode">
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ===== CONTROLS (DUE DATE, MONTH, YEAR & TOTALS) ===== -->
  <section class="controls">
    <!-- Filter Bar: Due Date, Month, Year -->
    <div class="controls-filters">
      <div class="filter-group">
        <label for="dueDate">Due Date</label>
        <select id="dueDate">
          <option value="AKINSE">AKINSE (15th)</option>
          <option value="ATRENTA">ATRENTA (30th)</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="month">Month</label>
        <select id="month"></select>
      </div>
      <div class="filter-group">
        <label for="year">Year</label>
        <select id="year"></select>
      </div>
    </div>

    <!-- Below: Total Count of GCASH and CASH -->
    <div class="controls-totals">
      <div class="total-badge gcash-badge" title="Total GCASH for current view">
        <span class="total-label">TOTAL GCASH</span>
        <span class="total-value" id="totalGcash">0</span>
      </div>
      <div class="total-badge cash-badge" title="Total CASH for current view">
        <span class="total-label">TOTAL CASH</span>
        <span class="total-value" id="totalCash">0</span>
      </div>
    </div>
  </section>

  <!-- ===== FIXED HEADER TABLE ===== -->
  <section class="table-container">
    <div class="table-scroll">
      <table id="routeTable">
        <thead>
          <tr>
            <th class="col-seq">#</th>
            <th class="col-account">Account #</th>
            <th class="col-name">Fullname</th>
            <th class="col-date">Received Date</th>
            <th class="col-mop">MOP</th>
            <th class="col-lastmop">Last Month</th>
          </tr>
        </thead>
        <tbody id="routeTableBody">
          <!-- Populated by JS -->
        </tbody>
      </table>
    </div>
    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
      </svg>
      <p>No routes found.</p>
      <p class="empty-hint">Click <strong>"Add Row"</strong> at the top right to add a member.</p>
    </div>
  </section>

  <!-- ===== SELECTED ROW ACTION PANEL ===== -->
  <section class="action-panel" id="actionPanel">
    <div class="action-panel-content">
      <div class="action-panel-info">
        <div class="info-item info-member">
          <span class="info-label">Selected Member</span>
          <div class="info-member-line">
            <span class="info-account" id="infoAccountNo">—</span>
            <span class="info-name" id="infoMemberName">—</span>
          </div>
        </div>
        <div class="info-item">
          <span class="info-label">Membership Level</span>
          <span class="info-value" id="infoMembershipLevel">—</span>
        </div>
        <div class="info-item">
          <span class="info-label">Remarks</span>
          <span class="info-value" id="infoRemarks">—</span>
        </div>
      </div>
      <div class="action-panel-buttons">
        <button id="btnEditRow" class="btn btn-sm btn-outline" title="Edit row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <span>Edit</span>
        </button>
        <button id="btnDeleteRow" class="btn btn-sm btn-outline btn-outline-danger" title="Delete row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          <span>Delete</span>
        </button>
        <button id="btnMoveUp" class="btn btn-sm btn-outline" title="Move Up">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="18 15 12 9 6 15"/></svg>
          <span>Up</span>
        </button>
        <button id="btnMoveDown" class="btn btn-sm btn-outline" title="Move Down">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="6 9 12 15 18 9"/></svg>
          <span>Down</span>
        </button>
        <button id="btnClosePanel" class="btn btn-sm btn-outline" title="Deselect">
          <span>&times;</span>
        </button>
      </div>
    </div>
  </section>

  <!-- ===== CUSTOM POP-UP MODAL (NO BROWSER ALERTS) ===== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Modal</h3>
        <button class="modal-close" id="modalClose" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- ===== LOADING MODAL (PROGRESS BAR POP-UP MODAL, NO SCREEN BLUR) ===== -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-modal">
      <div class="loading-modal-top">
        <div class="loading-spinner-circle"></div>
        <h4 class="loading-modal-title" id="loadingTitle">Syncing with Sheets</h4>
      </div>
      <p class="loading-modal-text" id="loadingText">Connecting to sheets...</p>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
      <div class="progress-percent" id="progressPercent">0%</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
